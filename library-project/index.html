<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="./library.css" />
    <script src="./library.js" defer></script>
  </head>
  <body>
    <div class="book-list">
      My Books
      <ul id="book-info"></ul>
    </div>
    <div class="add-book">
      <button id="open-dialog" type="button">Add Book</button>
      <dialog id="dlgAddBook">
        <form method="dialog">
          <fieldset id="fldSet">
            <legend>Add book to My Library</legend>
            <p>
              <label for="title">Title</label>
              <input id="title" type="text" required autofocus value="Title" />
            </p>
            <p>
              <label for="author">Author</label>
              <input id="author" type="text" required value="Author" />
            </p>
            <p>
              <label for="pages">Pages</label>
              <input id="pages" type="number" required value="1" />
            </p>
            <p>
              <label for="read">Read Status</label>
              <select name="read" id="read">
                <option value="true">Have read</option>
                <option value="false">Have NOT read</option>
              </select>
            </p>
            <button id="insertBook" value="add">Add</button>
            <button value="cancel" formmethod="dialog">Cancel</button>
          </fieldset>
        </form>
      </dialog>
    </div>
    <!-- <a href="../index.html">My Odin Project root</a> -->
  </body>
</html>
